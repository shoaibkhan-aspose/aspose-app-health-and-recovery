[project]
name = "site-health-recovery"
version = "0.1.0"
description = "Domain-agnostic agents that audit a web property and (later) fix what they find."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "google-auth>=2.30",
  "google-api-python-client>=2.130",
  "google-analytics-data>=0.17",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]  # MCPServer API (FastMCP was renamed in 2.x)
agents = ["langgraph>=0.2", "langchain-mcp-adapters>=0.1"]
crawl = ["httpx>=0.27", "selectolax>=0.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "mcp_servers*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

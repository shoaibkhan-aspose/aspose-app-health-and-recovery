# Rebuild the site health report from the committed run files and publish it on GitHub Pages.
# Renders only: audits run on SK's Mac (network + Google key) and commit reports/*.json and findings.json.
name: Publish report

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build report (newest discovery run + newest crawl audit)
        run: >
          python scripts/build_report.py --findings reports/findings.json
          --notes reports/discovery-notes.txt --audit-notes reports/crawl-audit-notes.txt
          --standalone --out site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

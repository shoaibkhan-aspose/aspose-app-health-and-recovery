<title>Moved: site health reports</title>
<script>
// The reports moved from /aspose-app-health-and-recovery/ to /health-and-recovery/ (2026-10-20).
// Keep the rest of the path, the query and the #anchor. The old root and /archive/ were the aspose.app report.
(function () {
  var OLD = "/aspose-app-health-and-recovery", NEW = "/health-and-recovery";
  var rest = location.pathname.indexOf(OLD) === 0 ? location.pathname.slice(OLD.length) : location.pathname;
  if (rest === "" || rest === "/" || rest === "/index.html") rest = "/aspose.app/";
  else if (rest === "/archive" || rest.indexOf("/archive/") === 0) rest = "/aspose.app" + rest;
  location.replace(NEW + rest + location.search + location.hash);
})();
</script>

notes:
- applies_to: crawl/robots_missing/products.aspose.app/robots.txt
  note: 'Likely root cause (was seed-crawl-01): the products Hugo build generates robots.txt (config.toml enableRobotsTXT=true), but its template themes/lutsk-aspose-theme/layouts/robots.txt emits only
    ''User-agent: *'' (no Sitemap line, unchanged since 2024-02-26), and the path-routed host never serves /robots.txt from the Hugo bucket. Fix needs the routing/CDN owner plus a template change listing
    every family sitemap.'
